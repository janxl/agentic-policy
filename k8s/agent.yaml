apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-data
  namespace: agentic-decision
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: agentic-decision
spec:
  replicas: 1
  strategy:
    type: Recreate  # one SQLite writer on a single RWO volume: never two agent pods at once
  selector:
    matchLabels: {app: agent}
  template:
    metadata:
      labels: {app: agent}
    spec:
      containers:
        - name: agent
          image: agentic-decision/agent:dev
          ports:
            - containerPort: 8000
          env:
            - name: LOG_LLM       # full LLM request/response JSON: "true" / "false"
              value: "true"
            - name: ACCESS_LOG    # uvicorn "POST /chat 200 OK" lines: "true" / "false"
              value: "true"
            - name: DB_PATH       # conversation history (SQLite on the agent-data volume)
              value: /data/agent.db
            - name: MAX_CONTEXT_MESSAGES  # most recent messages sent to the model; all are stored
              value: "24"
            - name: SYSTEM_PROMPT  # optional: replaces the default "You are a helpful assistant."
              value: ""
            - name: POLICY_CONFIG  # the data policies the gate checks every request against
              value: /config/policies.toml
            - name: LOG_LAYA       # log what is sent to and received from the decision model: "true" / "false"
              value: "true"
            - name: LAYA_URL       # the decision model; unset = plain rules only
              value: http://laya:8000
            - name: DEFAULT_ROUTE  # where requests go when no policy applies: "public" or "local"
              value: public        # (`make use-local` / `make use-claude` change it)
            - name: PUBLIC_MODEL   # the public model (Claude)
              value: claude-sonnet-5-5
            - name: LOCAL_MODEL    # the local model (Ollama)
              value: qwen3:4b-instruct
            - name: LOCAL_BASE_URL
              value: http://ollama:11434
            - name: ANTHROPIC_API_KEY  # needed for the public model; without it everything uses the local one
              valueFrom:
                secretKeyRef:
                  name: anthropic  # must match metadata.name in secret.yaml
                  key: ANTHROPIC_KEY
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agent-data
        - name: config
          configMap:
            name: app-config  # made from policies.toml by `make config`
            optional: true       # the agent still starts (no policies) without it
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: agentic-decision
spec:
  selector: {app: agent}
  ports:
    - port: 8000
